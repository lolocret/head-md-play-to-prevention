<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nexus</title>
  <link rel="stylesheet" href="phone.css">
</head>
<body>
  <div id="app">
    <div id="status">
      <span class="brand">NEXUS</span>
      <span class="icons" aria-hidden="true">
        <svg width="18" height="14" viewBox="0 0 18 14"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1" opacity=".35"/></svg>
        <svg width="22" height="14" viewBox="0 0 22 14"><rect x="1" y="1" width="17" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="3" width="10" height="8" rx="1.5"/><rect x="19" y="5" width="2" height="4" rx="1"/></svg>
      </span>
    </div>

    <header id="top">
      <span class="sil" id="meSil"><i></i><b></b></span>
      <span id="meName"></span>
    </header>

    <section id="gate">
      <b class="logo">NEXUS</b>
      <p id="gateText"></p>
      <button id="answer"></button>
      <p id="gateNote"></p>
    </section>

    <section id="list" hidden></section>
    <section id="thread" hidden>
      <button id="back">‹</button>
      <h2 id="threadTitle"></h2>
      <div id="bubbles"></div>
    </section>

    <section id="journalView" hidden>
      <h2 id="jTitle"></h2>
      <div id="jEntries"></div>
      <div id="jPrompts"></div>
    </section>

    <div id="notif" hidden></div>

    <nav id="bar" hidden>
      <button id="tabMsgs"></button>
      <button id="tabJournal"></button>
      <button id="tabTorch"></button>
    </nav>
    <div id="torch" hidden></div>
  </div>
  <script src="phone.js"></script>
</body>
</html>
