<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#08070f">
  <title>Nexus</title>
  <link rel="stylesheet" href="phone.css">
</head>
<body>
  <div id="app">
    <div id="status">
      <span class="brand">NEXUS</span>
    </div>

    <header id="top" hidden>
      <span class="sil" id="meSil"><i></i><b></b></span>
      <span id="meName"></span>
      <h1 id="screenTitle"></h1>
    </header>

    <section id="gate">
      <b class="logo">NEXUS</b>
      <p id="gateText"></p>
      <button id="answer"></button>
      <p id="gateNote"></p>
    </section>

    <section id="list" hidden></section>

    <section id="thread" hidden>
      <div class="threadbar">
        <button id="back" aria-label="Retour">
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
        </button>
        <h2 id="threadTitle"></h2>
      </div>
      <div id="bubbles"></div>
    </section>

    <section id="journalView" hidden>
      <div id="jEntries"></div>
      <div id="jPrompts"></div>
    </section>

    <section id="choiceView" hidden>
      <h2 id="placeName"></h2>
      <p id="choicePrompt"></p>
      <p id="goalHint" hidden></p>
      <div id="choiceList"></div>
      <div id="exitList"></div>
      <p id="choiceSent" hidden></p>
    </section>

    <button id="notif" hidden type="button">
      <span class="n-head"><span class="n-icon" id="nIcon"></span><span class="n-app">NEXUS</span><span class="n-time" id="nTime"></span></span>
      <b class="n-title" id="nTitle"></b>
      <span class="n-body" id="nBody"></span>
    </button>

    <nav id="bar" hidden>
      <button id="tabChoice">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3v6M5 14l8-5 8 5M5 14v4M21 14v4M13 9v13"/></svg>
        <span class="lbl"></span><i class="dotb"></i>
      </button>
      <button id="tabMsgs">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h18a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H12l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>
        <span class="lbl"></span><i class="dotb" hidden></i>
      </button>
      <button id="tabJournal">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3h13a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6z"/><path d="M6 3v20M10 8h6M10 12h6"/></svg>
        <span class="lbl"></span><i class="dotb" hidden></i>
      </button>
    </nav>
  </div>
  <script src="phone.js"></script>
</body>
</html>
